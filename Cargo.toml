[package]
name = "resumereaderapi"
version = "0.1.1"
edition = "2021"
authors = ["Alpha Quantum <info@alpha-quantum.com>"]
description = "Rust client for the Resume Reader API: parse PDF, DOCX and scanned resumes into 114 structured JSON fields, and normalize job titles, skills and locations"
license = "MIT"
homepage = "https://www.resumereaderapi.com"
repository = "https://github.com/explainableaixai/resumereaderapi-rust"
documentation = "https://www.resumereaderapi.com/api-v2.php"
readme = "README.md"
keywords = ["resume", "cv", "parser", "recruiting", "hr"]
categories = ["api-bindings", "web-programming"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
